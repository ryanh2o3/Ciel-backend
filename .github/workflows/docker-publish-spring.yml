name: Publish Spring API image (GHCR)

# Builds ciel-api-spring and pushes to GHCR for Unraid k3d / kubectl.
#
# Tags on main:
#   ghcr.io/<owner>/ciel-api-spring:main
#   ghcr.io/<owner>/ciel-api-spring:latest
#   ghcr.io/<owner>/ciel-api-spring:sha-<shortsha>

on:
  push:
    branches: [main]
    paths:
      - "spring/**"
      - ".github/workflows/docker-publish-spring.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ciel-api-spring

jobs:
  test:
    name: Spring tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test

  build-and-push:
    name: Build and Push Spring to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./spring
          file: ./spring/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
