name: Publish Docker image (GHCR)

# Builds the Ciel API/worker image and pushes to GitHub Container Registry
# so Unraid (or any host) can `docker pull` instead of compiling on-box.
#
# Tags on main:
#   ghcr.io/<owner>/ciel-backend:main
#   ghcr.io/<owner>/ciel-backend:sha-<shortsha>
#
# Unraid update (manual):
#   docker compose -f docker-compose.unraid.yml --env-file .env pull api worker
#   docker compose -f docker-compose.unraid.yml --env-file .env up -d api worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ciel-backend

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and Push to GHCR
    needs: tests
    runs-on: ubuntu-latest
    # Only publish from main (or manual dispatch). PRs that call tests via
    # path filters never reach here unless workflow_dispatch / push to main.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
