# Traefik CRDs (k3s often ships Traefik). Opaque weighted pool + header pin.
# Requires Traefik with providers.kubernetesCRD.enabled=true
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ciel-api
  namespace: ciel
spec:
  entryPoints:
    - web
  routes:
    # Explicit backend selection (debug / parity). Higher priority than opaque.
    - match: PathPrefix(`/`) && Header(`X-Ciel-Backend`, `rust`)
      kind: Rule
      priority: 100
      services:
        - name: ciel-api-rust
          port: 8080
    - match: PathPrefix(`/`) && Header(`X-Ciel-Backend`, `spring`)
      kind: Rule
      priority: 100
      services:
        - name: ciel-api-spring
          port: 8080
    - match: PathPrefix(`/`) && Header(`X-Ciel-Backend`, `dotnet`)
      kind: Rule
      priority: 100
      services:
        - name: ciel-api-dotnet
          port: 8080
    # Opaque default: weighted round-robin across implementations.
    # Keep only Ready backends in this list — Traefik still picks by weight even
    # when a Service has 0 Endpoints, which surfaces as intermittent 502s.
    # Header pin routes above still reach spring/dotnet for parity debugging.
    # When .NET is healthy: e.g. rust 50 / spring 25 / dotnet 25.
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 10
      services:
        - name: ciel-api-rust
          port: 8080
          weight: 50
        - name: ciel-api-spring
          port: 8080
          weight: 50
---
# Optional NodePort/LB for Cloudflare Tunnel (or hostNetwork Traefik).
# Point the tunnel public hostname at this service instead of compose `api:8080`.
apiVersion: v1
kind: Service
metadata:
  name: ciel-api-ingress
  namespace: ciel
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 8000
      nodePort: 30080
