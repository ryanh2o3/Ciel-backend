# Copy to ciel-secrets.yaml (gitignored) and fill values, or create via:
#   kubectl -n ciel create secret generic ciel-env --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: ciel-env
  namespace: ciel
type: Opaque
stringData:
  DATABASE_URL: "postgres://ciel:CHANGE_ME@ciel-postgres:5432/ciel"
  REDIS_URL: "redis://ciel-redis:6379"
  S3_ENDPOINT: "http://ciel-minio:9000"
  S3_PUBLIC_ENDPOINT: "https://home-media.ciel-social.eu"
  S3_REGION: "us-east-1"
  S3_BUCKET: "ciel-media"
  S3_ACCESS_KEY: "cielminio"
  S3_SECRET_KEY: "CHANGE_ME"
  S3_FORCE_PATH_STYLE: "true"
  QUEUE_ENDPOINT: "http://ciel-queue:9324"
  QUEUE_REGION: "us-east-1"
  QUEUE_NAME: "ciel-media-jobs"
  SQS_ACCESS_KEY: "x"
  SQS_SECRET_KEY: "x"
  PASETO_ACCESS_KEY: "CHANGE_ME_BASE64_32_BYTES"
  PASETO_REFRESH_KEY: "CHANGE_ME_BASE64_32_BYTES"
  ACCESS_TTL_MINUTES: "15"
  REFRESH_TTL_DAYS: "30"
  ADMIN_TOKEN: ""
  UPLOAD_URL_TTL_SECONDS: "900"
  UPLOAD_MAX_BYTES: "10485760"
  RUST_LOG: "info"
