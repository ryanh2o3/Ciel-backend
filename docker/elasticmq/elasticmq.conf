include classpath("application.conf")

# Advertise the Docker service hostname so GetQueueUrl returns a URL
# that api/worker containers can reach (not localhost). For k8s pods, set
# ELASTICMQ_ADVERTISE_HOST to the host's LAN IP so queue URLs are reachable
# from inside the cluster.
node-address {
  protocol = http
  host = elasticmq
  host = ${?ELASTICMQ_ADVERTISE_HOST}
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  ciel-media-jobs {
    defaultVisibilityTimeout = 300 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
